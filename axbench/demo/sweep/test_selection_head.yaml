generate:
  lm_model: "gpt-4o-mini"
  input_length: 32
  output_length: 32
  num_of_examples: 8  # Reduced for quick test
  concept_path: "axbench/data/gemma-2-2b_20-gemmascope-res-16k.json"
  max_concepts: 2  # Reduced for quick test
  dataset_category: "instruction"
  master_data_dir: "axbench/data"
  seed: 42
  keep_orig_axbench_format: true

train:
  model_name: "google/gemma-2-2b-it"
  layer: 20
  component: "res"
  seed: 42
  use_bf16: true
  output_length: 128
  models: 
    HyperSteer:
      batch_size: 2  # Reduced for quick test
      gradient_accumulation_steps: 1
      n_epochs: 1  # Reduced for quick test
      lr: 0.00008
      weight_decay: 0.00
      low_rank_dimension: 1
      intervention_positions: "all"
      intervention_type: "addition"
      binarize_dataset: false
      train_on_negative: false
      exclude_bos: true
      # hypernet_name_or_path: "/nlp/scr/sjd24/hyperreft-2b"
      hypernet_name_or_path: "google/gemma-2-2b"
      num_hidden_layers: 4
      hypernet_initialize_from_pretrained: true
      # SelectionHead parameters
      use_selection_head: true
      use_ln: true
      selection_head_start_temperature: 0.8
      selection_head_end_temperature: 0.2
      selection_head_learnable_temperature: false
      selection_head_add_gumbel_noise: true
      selection_head_straight_through: true
      selection_l1_loss_coeff: 0.5

inference:
  use_bf16: true
  models: ["HyperSteer"] 
  model_name: "google/gemma-2-2b-it"
  # latent related params
  output_length: 128
  latent_num_of_examples: 4  # Reduced for quick test
  latent_batch_size: 2
  # steering related params
  steering_intervention_type: "addition"
  steering_model_name: "google/gemma-2-2b-it"
  steering_datasets: ["AlpacaEval"]
  steering_batch_size: 2
  steering_output_length: 128
  steering_layers: [10]
  steering_num_of_examples: 4  # Reduced for quick test
  steering_factors: [0.0, 0.5, 1.0]  # Reduced for quick test
  inference_binarize_mask: true  # Test hard masking during inference
  # master data dir is shared across all jobs.
  master_data_dir: "axbench/data"
  seed: 42
  lm_model: "gpt-4o-mini"
  # generation related params
  temperature: 1.0

evaluate:
  models: ["HyperSteer"] 
  latent_evaluators: [
    "AUCROCEvaluator",
  ]
  steering_evaluators: [
    "LMJudgeEvaluator",
  ]
  winrate_split_ratio: 0.5
  # Number of processes to run in parallel for steering evaluation.
  num_of_workers: 4  # Reduced for quick test
  lm_model: "gpt-4o-mini"
  run_winrate: false
  winrate_baseline: "PromptSteering"
  # master data dir is shared across all jobs.
  master_data_dir: "axbench/data" 